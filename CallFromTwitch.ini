; CallFromTwitch - base version
; Place this file next to CallFromTwitch.dll in GTA V\scripts\

[Server]
; Address of the Python voice server (voice_server\run_server.bat).
; Host and Port are split because the INI parser cuts a value at the first ':',
; which would leave a bare "http" behind for a full URL.
Host = 127.0.0.1
Port = 8765
; Give the first request room: RVC loads hubert/rmvpe inside the first
; conversion, which alone takes ~60s on a laptop GPU. Later calls are seconds.
TimeoutSeconds = 180

[Voice]
; RVC voice = a folder name in voice_server\models\rvc\ (Franklin, Michael,
; Trevor), or the name of a loose <name>.pth there. Case does not matter.
; If the server has no such voice it uses the one picked at its startup.
Character = Trevor
; Текст зрители пишут НА АНГЛИЙСКОМ: опорный голос Piper — американский
; (en_US-ryan-high), а RVC меняет тембр, но сохраняет акцент оригинала.

[Call]
; The line is delivered by an incoming phone call: the phone rings, and the
; voice is heard only after the player answers. Needs iFruit Jailbreak.dll
; in the same scripts\ folder.
; Name shown on the call screen
CallerName = Michael
; Contact picture: any CHAR_* texture the game ships (CHAR_DEFAULT,
; CHAR_MICHAEL, CHAR_TREVOR, CHAR_FRANKLIN, CHAR_LESTER, CHAR_CALL911 ...)
CallerIcon = CHAR_MICHAEL
; How long after the voice is ready the phone starts ringing
DelaySeconds = 5
; How long it rings before the call counts as missed
RingSeconds = 20
; Extra pause after the line before hanging up, so the last word survives
HangUpDelayMs = 1200

[Audio]
; 0.0 - 1.0
Volume = 1.0
ShowSubtitle = true

[Twitch]
; Читать чат Twitch и озвучивать команды зрителей. false — мод работает
; по-старому, только от файла и хоткея.
Enabled = true
; Канал, чей чат слушать: ТОЛЬКО имя, без https://
; (парсер INI режет значение по первому ':', и от ссылки остаётся "https").
; Правильно:  Channel = kreyg
Channel = jurarework
; Username и Token можно не заполнять: без них мод заходит в чат анонимно
; (justinfan) и просто читает его — этого достаточно, чтобы всё работало.
; Токен нужен будет позже, когда моду понадобится ПИСАТЬ в чат или читать
; награды за баллы канала. Взять его можно на https://twitchapps.com/tmi/
; ВНИМАНИЕ: токен пишется в этот файл открытым текстом. Не выкладывайте
; CallFromTwitch.ini в общий доступ и не показывайте его на стриме.
Username =
Token =
; Команда, с которой начинается реплика: "!call эй, как дела".
; Пустое значение — озвучивать КАЖДОЕ сообщение в чате (осторожно).
Command = !call
; ------------------------------------------------------------------
; КТО МОЖЕТ ЗАКАЗАТЬ ЗВОНОК
; ------------------------------------------------------------------
; Четыре способа, и они СКЛАДЫВАЮТСЯ, а не исключают друг друга: можно
; разрешить сабам бесплатно, а всем остальным — за биты или за баллы.
; Если выключить все четыре, мод молча не отвечал бы никому, поэтому в
; таком случае он возвращается к AllowChat = true.
;
; Модератор и сам стример не ограничены никогда — иначе проверить
; собственный мод можно было бы только задонатив самому себе.

; 1. Любой зритель по команде !call.
AllowChat = true

; 2. Только подписчики канала (плюс моды и стример) по команде !call.
;    Работает без токена: Twitch присылает значок сабскрайбера прямо
;    в сообщении.
AllowSubs = false

; 3. За биты (Cheer). Тоже без токена — сумма приходит в теге сообщения.
;    Слово "Cheer100" из реплики убирается, иначе его прочитают вслух.
AllowBits = false
; Меньше этого — не звонок. Биты покупаются за деньги, так что это и есть
; "донат" внутри самого Twitch.
MinBits = 100

; 4. За баллы канала. ВАЖНО: баллы принципиально нельзя прочитать из чата,
;    их отдаёт только EventSub с токеном САМОГО СТРИМЕРА. Поэтому их
;    слушает voice_server (см. секцию [Events] ниже), а мод забирает у него
;    готовые события. Без настроенного сервера этот флаг ничего не даст.
AllowPoints = false

; 5. Денежные донаты через DonationAlerts — тоже через voice_server:
;    Twitch о таких донатах не знает вообще, о них знает только сервис,
;    принявший платёж.
AllowDonations = false
; Меньше этой суммы — не звонок. 0 — любая сумма. Валюта — та, в которой
; донат пришёл, мод её не конвертирует.
MinDonation = 0

; Как часто (мс) спрашивать у сервера новые события баллов/донатов.
EventPollMilliseconds = 1000

; Что сказать, если за событием нет текста: награда без поля ввода или
; донат без сообщения. Зритель заплатил за звонок, поэтому звонок всё
; равно происходит — просто с этой репликой. ПИШИТЕ ПО-АНГЛИЙСКИ.
DefaultEventText = Hey, thanks for the support!

; Старые ключи. Работают по-прежнему и СУЖАЮТ то, что разрешено выше:
; ModsOnly = true оставит только модераторов, SubsOnly = true — только сабов.
ModsOnly = false
SubsOnly = false
; Кулдаун на одного зрителя и общий, в секундах. 0 — без ограничения.
UserCooldownSeconds = 60
GlobalCooldownSeconds = 0
; Границы длины реплики. Слишком длинная обрезается по границе слова;
; MaxLength есть смысл держать не выше CFT_MAX_TEXT сервера (300).
MinLength = 2
MaxLength = 300
; Сколько реплик может ждать очереди. Лишние отбрасываются: очередь из
; полусотни сообщений будет разгребаться минут двадцать.
MaxQueue = 10
; Через сколько секунд реплика "протухает" и не озвучивается вовсе. Очередь
; переживает паузу, катсцену и миссию, во время которой телефон звонить не
; может, — а ответ на сообщение получасовой давности выглядит страннее, чем
; отсутствие ответа: зритель уже ушёл из чата. 0 — не отбрасывать никогда.
; Платные звонки (биты, баллы, донаты) живут вчетверо дольше указанного:
; за них заплатили, поэтому их стоит озвучить даже с опозданием.
MaxAgeSeconds = 300
; true — на экране звонка имя зрителя, false — всегда Call/CallerName.
UseViewerName = true

; ====================================================================
; БАЛЛЫ КАНАЛА И ДОНАТЫ — НАСТРАИВАЮТСЯ НЕ ЗДЕСЬ
; ====================================================================
; Этот файл читает мод внутри игры, а баллы и донаты слушает Python-сервер:
; ни то ни другое нельзя получить из чата. Его настройки лежат рядом с
; run_server.bat в файле events.env — там же написано, где взять токены.
;
; Флаги AllowPoints / AllowDonations выше включают ПРИЁМ этих событий модом.
; Сам сбор включается в events.env строкой CFT_EVENTS=1.
;
; ПРОВЕРКА БЕЗ ДЕНЕГ: задонатить самому себе и купить себе баллы нельзя,
; поэтому у сервера есть эмулятор. Запустите test_events.bat (лежит в
; voice_server\) — он пришлёт поддельный донат/баллы по настоящему пути,
; и в игре зазвонит телефон. Подробности — в README, раздел "Тестирование".
